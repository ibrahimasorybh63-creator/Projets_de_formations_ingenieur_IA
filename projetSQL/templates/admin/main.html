<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulateur boutique SQL</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <style>
    summary {
      list-style: none;
    }
    summary::-webkit-details-marker {
      display: none;
    }
  </style>
  <body>
    <div class="container mx-auto">
      <div class="flex flex-wrap justify-center bg-red-500 text-center">
        <h1 class="text-white text-4xl font-bold">
          <a href="/admin">Simulateur de boutique SQL</a>
        </h1>
      </div>
      <div class="flex flex-wrap rounded">
        <div class="bg-gray-900 w-1/5 gap-5 p-4 min-h-screen text-white">
          <div
            class="text-white rounded-full p-5 font-bold flex flex-wrap text-4xl gap-5"
          >
            <img
              src="{{ url_for('static', filename='img/user_img.jpg') }}"
              alt="image_admin"
              class="rounded-full h-1/4 w-1/4 border-2 border-black"
            />
            <h1>Admin</h1>
          </div>
          <div class="gap-5 p-5 hover:bg-gray-500 rounded">
            <details class="cursor-pointer">
              <summary class="flex flex-wrap">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                  />
                </svg>
                Clients
              </summary>
              <br />
              <button
                onclick="chargerContenu('/clients')"
                class="block hover:text-black hover:border-2 hover:bg-green-500 hover:rounded"
              >
                Catalogue des clients
              </button>
              <button
                onclick="afficher('form_modifier_client')"
                class="block hover:text-black hover:border-2 hover:bg-blue-500 hover:rounded"
              >
                Modifier client existant
              </button>
              <button
                onclick="afficher('form_supprimer_client')"
                class="block hover:text-black hover:border-2 hover:bg-red-500 hover:rounded"
              >
                Supprimer un client
              </button>
            </details>
          </div>
          <div class="gap-5 p-5 hover:bg-gray-500 rounded">
            <details class="cursor-pointer">
              <summary class="flex flex-wrap">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z"
                  />
                </svg>
                Produits
              </summary>
              <br />
              <button
                onclick="chargerContenu('/produits')"
                class="block hover:text-black hover:border-2 hover:bg-green-500 hover:rounded"
              >
                Catalogue des produits
              </button>
              <button
                onclick="afficher('form_ajout_produit')"
                class="block hover:text-black hover:border-2 hover:bg-blue-500 hover:rounded"
              >
                Ajouter un produit
              </button>
              <button
                onclick="afficher('form_modifier_produit')"
                class="block hover:text-black hover:border-2 hover:bg-blue-500 hover:rounded"
              >
                Modifier produit existant
              </button>
              <button
                onclick="afficher('form_supprimer_produit')"
                class="block hover:text-black hover:border-2 hover:bg-red-500 hover:rounded"
              >
                Supprimer un produit
              </button>
            </details>
          </div>
          <div class="gap-5 p-5 hover:bg-gray-500 rounded">
            <details class="cursor-pointer">
              <summary class="flex flex-wrap">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"
                  />
                </svg>
                Commandes
              </summary>
              <br />
              <button
                onclick="chargerContenu('/commandes')"
                class="block hover:text-black hover:border-2 hover:bg-green-500 hover:rounded"
              >
                Catalogue des commandes
              </button>
              <button
                onclick="afficher('form_ajout_commande')"
                class="block hover:text-black hover:border-2 hover:bg-blue-500 hover:rounded"
              >
                Ajouter une commande
              </button>
              <button
                onclick="afficher('form_supprimer_commande')"
                class="block hover:text-black hover:border-2 hover:bg-red-500 hover:rounded"
              >
                Supprimer une commande
              </button>
            </details>
          </div>
          <div class="p-5 text-white hover:bg-gray-500 rounded">
            <button style="display: flex" onclick="afficher('zone_dashboard')">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
                />
              </svg>
              Dashboard
            </button>
          </div>
        </div>
        <!--- debut de la partie droite -->
        <div class="w-4/5 p-5">
          <div id="zone_dashboard">
            <h1 class="text-3xl font-bold mb-6">Tableau de bord</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <div class="bg-white rounded-lg shadow p-4">
                <p class="text-gray-500 text-sm">Clients</p>
                <p class="text-3xl font-bold text-blue-600">
                  {{ stats.nb_clients }}
                </p>
              </div>
              <div class="bg-white rounded-lg shadow p-4">
                <p class="text-gray-500 text-sm">Produits</p>
                <p class="text-3xl font-bold text-blue-600">
                  {{ stats.nb_produits }}
                </p>
              </div>
              <div class="bg-white rounded-lg shadow p-4">
                <p class="text-gray-500 text-sm">Commandes</p>
                <p class="text-3xl font-bold text-blue-600">
                  {{ stats.nb_commandes }}
                </p>
              </div>
              <div class="bg-white rounded-lg shadow p-4">
                <p class="text-gray-500 text-sm">Chiffre d'affaires</p>
                <p class="text-3xl font-bold text-green-600">
                  {{ stats.ca_total }} GNF
                </p>
              </div>
            </div>
            <!-- Le graphique -->
            <div class="bg-white rounded-lg shadow p-4">
              <h2 class="text-xl font-bold mb-4">Produits les plus achetés</h2>
              <canvas id="graphProduits"></canvas>
            </div>
          </div>
          <div class="p-5">
            <div id="zone_catalogue"></div>
            <div id="zone_formulaires">
              <!-- partie droite -->
              <!-- PRODUITS -->
              <div
                id="form_ajout_produit"
                class="border-2 rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/produits/ajouter" method="post">
                  <input
                    class="border-2 border-black rounded m-1"
                    type="text"
                    placeholder="nom du produit"
                    name="nom"
                  />
                  <input
                    class="border-2 border-black rounded m-1"
                    type="number"
                    min="1"
                    placeholder="prix"
                    name="prix"
                  />
                  <input
                    class="border-2 border-black rounded m-1"
                    type="text"
                    placeholder="type"
                    name="type_prod"
                  />
                  <input
                    class="border-2 border-black rounded m-1 bg-blue-500"
                    type="submit"
                    value="Ajouter"
                  />
                </form>
              </div>

              <div
                id="form_modifier_produit"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/produits/modifier" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id du produit"
                    name="produits_id"
                    class="border-2 border-black rounded m-1"
                  />
                  <input
                    type="number"
                    class="border-2 border-black rounded m-1"
                    min="1"
                    placeholder="nouveau prix"
                    name="prix"
                  />
                  <input
                    type="submit"
                    class="border-2 border-black rounded m-1 bg-green-500"
                    value="Modifier"
                  />
                </form>
              </div>

              <div
                id="form_supprimer_produit"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/produits/supprimer" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id du produit"
                    name="produits_id"
                    class="border-2 border-black rounded m-1"
                  />
                  <input
                    type="submit"
                    value="Supprimer"
                    class="border-2 border-black rounded m-1 bg-red-500"
                  />
                </form>
              </div>

              <!-- ===== CLIENTS ===== -->
              <div
                id="form_modifier_client"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/clients/modifier" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id du client"
                    name="clients_id"
                    class="border-2 border-black rounded m-1"
                  />
                  <input
                    class="border-2 border-black rounded m-1"
                    type="text"
                    placeholder="nom"
                    name="nom"
                  />
                  <input
                    class="border-2 border-black rounded m-1"
                    type="text"
                    placeholder="prénom"
                    name="prenom"
                  />
                  <input
                    class="border-2 border-black rounded m-1"
                    type="text"
                    placeholder="adresse"
                    name="adresse"
                  />
                  <input
                    class="border-2 border-black rounded m-1 bg-green-500"
                    type="submit"
                    value="Modifier"
                  />
                </form>
              </div>

              <div
                id="form_supprimer_client"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/clients/supprimer" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id du client"
                    name="clients_id"
                    class="border-2 border-black rounded m-1"
                  />
                  <input type="submit" value="Supprimer" class="border-2 border-black rounded m-1 bg-red-500"/>
                </form>
              </div>

              <!-- ===== COMMANDES ===== -->
              <div
                id="form_ajout_commande"
                class="border rounded p-4 border-2 border-black rounded m-1 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/commandes/ajouter" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id du client"
                    name="clients_id"
                    required
                    class="border-2 border-black rounded m-1"
                  />
                  <input type="date" name="date_comm" class="border-2 border-black rounded m-1" required />
                  <div id="lignes_produits">
                    <div class="ligne_produit">
                      <input
                        type="number"
                        min="1"
                        placeholder="id produit"
                        name="produits_id[]"
                        class="border-2 border-black rounded m-1"
                        required
                      />
                      <input
                        type="number"
                        min="1"
                        placeholder="quantité"
                        name="quantite[]"
                        required
                        class="border-2 border-black rounded m-1"
                      />
                    </div>
                  </div>
                  <br />
                  <button
                    type="button"
                    id="btn_ajouter_ligne"
                    class="rounded border-2 border-black bg-gray-200"
                  >
                    + Ajouter un produit
                  </button>
                  <br /><br />
                  <input
                    type="submit"
                    value="Enregistrer la commande"
                    class="rounded border-2 border-black bg-green-500"
                  />
                </form>
              </div>

              <div
                id="form_modifier_commande"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/commandes/modifier" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id de la commande"
                    name="commandes_id"
                    class="border-2 border-black rounded m-1"
                    required
                  />
                  <input
                    type="date"
                    placeholder="nouvelle date"
                    name="date_comm"
                    class="border-2 border-black rounded m-1"
                    required
                  />
                  <input
                    type="number"
                    min="1"
                    placeholder="nouvel id client"
                    name="clients_id"
                    class="border-2 border-black rounded m-1"
                    required
                  />
                  <input type="submit" value="Modifier" />
                </form>
              </div>

              <div
                id="form_supprimer_commande"
                class="border rounded p-4 flex items-center text-center gap-5"
                style="display: none"
              >
                <form action="/commandes/supprimer" method="post">
                  <input
                    type="number"
                    min="1"
                    placeholder="id de la commande"
                    name="commandes_id"
                    class="border-2 border-black rounded m-1"
                    required
                  />
                  <input type="submit" value="Supprimer" class="border-2 border-black rounded m-1 bg-red-500" />
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="{{ url_for('static', filename='admin_dashboard.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('graphProduits');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ noms_produits | tojson }},
            datasets: [{
                label: 'Quantité vendue',
                data: {{ quantites | tojson }},
                backgroundColor: '#3b82f6'
            }]
        }
    });
  </script>
</html>
