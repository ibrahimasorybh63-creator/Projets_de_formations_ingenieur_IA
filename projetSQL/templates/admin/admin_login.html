<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>connexion administrateur</title>
  </head>
  <body class="bg-gray-400 min-h-screen flex items-center justify-center">
    <div
      id="zone_toast"
      class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col gap-2"
    ></div>
    <div
      class="flex flex-col h-1/2 w-1/3 bg-gray-100 text-center justify-center p-5 rounded items-center"
    >
      <img
        src="{{url_for('static', filename='img/user_img.jpg')}}"
        alt="logo de la boutique"
        class="rounded-full border border-black w-1/4 h-1/2 text-center justify-center p-5"
      />
      <h1 class="text-2xl font-bold">Connection au système d'administration</h1>
      <label for="">Adresse mail</label>
      <input
        type="email"
        name="mail"
        id="mail"
        placeholder=" votremail@gmail.com"
        class="border-black border-2 rounded w-3/4 bg-gray-100 p-1"
      />
      <label for="">Mot de passe</label>
      <div class="relative w-3/4">
        <input
          type="password"
          id="mdp"
          class="border-black border-2 rounded bg-gray-100 p-1 w-full"
          required
        />
        <button
          type="button"
          id="toggle_mdp"
          class="absolute right-2 top-1/2 -translate-y-1/2 hover:bg-gray-300 rounded-full"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            id="open_eye"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 hidden"
            id="closed_eye"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
            />
          </svg>
        </button>
      </div>
      <br />
      <button
        type="button"
        class="bg-green-500 rounded border-black p-1 border-2"
        id="admin_login"
      >
        Se connecter
      </button>
    </div>
  </body>
  <script src="{{ url_for('static', filename='commun.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</html>
