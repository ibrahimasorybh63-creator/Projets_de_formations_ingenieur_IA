<div style="width: 100%; height: 100%">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-2">Contactez-nous</h2>
    <p class="text-gray-500 mb-6">
      Une question sur un produit, une commande ou autre chose ? Écrivez-nous.
    </p>

    <div class="mb-6 space-y-2">
      <p class="text-gray-700">
        <span class="font-semibold">Email :</span>
        <a
          href="mailto:ibrahimasorybh63@gmail.com"
          class="text-blue-600 hover:underline"
          >ibrahimasorybh63@gmail.com</a
        >
      </p>
      <p class="text-gray-700">
        <span class="font-semibold">Adresse :</span> Conakry, Guinée
      </p>
    </div>

    <form action="/contact" method="post" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1" for="nom">Nom</label>
        <input
          type="text"
          id="nom"
          name="nom"
          class="border rounded w-full p-2"
          placeholder="Votre nom"
        />
      </div>
      <div>
        <label class="block text-gray-700 mb-1" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="border rounded w-full p-2"
          placeholder="votre@email.com"
        />
      </div>
      <div>
        <label class="block text-gray-700 mb-1" for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="4"
          class="border rounded w-full p-2"
          placeholder="Votre message..."
        ></textarea>
      </div>
      <input type="submit" value="Envoyer" class="bg-green-400 rounded px-4 py-2 font-semibold hover:bg-green-500 transition">
    </form>
  </div>
</div>
