<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='tailwind_config.js') }}"></script>
  </head>
  <body class="bg-gray-400 min-h-screen flex items-center justify-center">
    <div
      id="zone_toast"
      class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col gap-2"
    ></div>
    <div
      class="w-1/2 h-1/2 rounded border-2 border-black text-center justify-center gap-5 bg-white p-5 m-5"
    >
      <div class="flex flex-col items-center">
        <img
          src="{{url_for('static', filename='img/logo_boutique.jpeg')}}"
          alt="logo de la boutique"
          class="h-1/4 w-1/4"
          style="border-radius: 60%"
        />
      </div>
      <h1 class="text-2xl font-bold">Connection à la boutique</h1>
      <label for="">Adresse mail</label>
      <br />
      <input
        type="email"
        name="mail"
        id="mail"
        placeholder=" votremail@gmail.com"
        class="border-black border-2 rounded w-1/2 bg-gray-100 p-1"
      />
      <br />
      <label for="">Mot de passe</label>
      <br />
      <input
        type="password"
        name="mdp"
        id="mdp"
        class="border-black border-2 rounded w-1/2 bg-gray-100 p-1"
      />
      <br /><br />
      <button
        type="button"
        class="bg-green-500 rounded border-black p-1 border-2"
        id="envoie"
      >
        Se connecter
      </button>
      <br />
      <a href="/inscription" class="text-blue-500"
        ><u>Je n'ai pas de compte.(créer un compte)</u></a
      >
    </div>
  </body>
  <script src="{{ url_for('static', filename='commun.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</html>
