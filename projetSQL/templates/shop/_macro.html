{% macro carte_produit(produit, couleur_fond="bg-white") %}
<div
  class="{{ couleur_fond }} rounded-lg shadow p-5 hover:bg-blue-100 transition duration-300 hover: transform hover:scale-105 cursor-pointer"
>
  <img
    src="{{ produit.image_url }}"
    alt="{{ produit.nom }}"
    class="w-full h-40 object-cover"
  />
  <h3 class="text-xl font-bold">{{ produit.nom }}</h3>
  <p class="text-gray-500">Type : {{ produit.type }}</p>
  {% if produit.prix_promo == None %}
  <p class="text-green-600 font-semibold">{{ produit.prix }} GNF</p>
  {% else %}
  <div class="flex flex-wrap gap-2">
    <s class="text-red-500 font-semibold">{{ produit.prix }} GNF</s>
    <p class="text-green-600">{{ produit.prix_promo }} GNF</p>
  </div>
  {% endif %}
  <details>
    <summary class="bg-green-400 rounded p-1 cursor-pointer inline-block">
      Ajouter au panier
    </summary>
    <div class="mt-2">
      <input
        type="number"
        min="1"
        value="1"
        id="quantite_{{ produit.id }}"
        class="border w-1/2"
      />
      <button
        class="bg-blue-500 rounded p-1"
        onclick="ajouterAuPanier(`{{ produit.id }}`)"
      >
        Valider
      </button>
    </div>
  </details>
</div>
{% endmacro %}
